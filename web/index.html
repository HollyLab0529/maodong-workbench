<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>猫冬手帐 · 慢慢记，暖暖存</title>
    <meta name="description" content="小猫守着的个人手帐：知识库、日历、待办、记账与随笔记" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png?v=20261111" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261111" />
    <meta name="theme-color" content="#9C3B36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="猫冬手帐" />
    <script>
      // 懒加载的代码分块在站点重建后 hash 会变，开着旧页面点导航会拉不到旧文件。
      // Vite 加载失败会派发 vite:preloadError，这里刷新一次拿新页面；
      // 用 sessionStorage 记录，避免新页面仍失败时陷入刷新循环。
      window.addEventListener("vite:preloadError", function (e) {
        e.preventDefault();
        var key = "wb-preload-reload";
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, String(Date.now()));
        location.reload();
      });
      window.addEventListener("load", function () {
        sessionStorage.removeItem("wb-preload-reload");
      });
    </script>
    <script>
      // 挂在子路径（作品集里的 /demo/ 反代）时，接口仍按根路径写，这里补前缀。
      // 根路径部署时 prefix 为空，行为完全不变。
      (function () {
        var m = location.pathname.match(/^(.*?\/demo)\//);
        if (!m) return;
        var prefix = m[1];
        var wrap = function (url) {
          return typeof url === "string" && url.indexOf("/api/") === 0 ? prefix + url : url;
        };
        var nativeFetch = window.fetch;
        window.fetch = function (input, init) {
          if (typeof input === "string") return nativeFetch.call(this, wrap(input), init);
          if (input && input.url) return nativeFetch.call(this, wrap(input.url), init);
          return nativeFetch.call(this, input, init);
        };
        var NativeES = window.EventSource;
        if (NativeES) {
          window.EventSource = class extends NativeES {
            constructor(url, cfg) { super(wrap(url), cfg); }
          };
        }
      })();
    </script>
    <script>
      // 主题防闪烁：在渲染前恢复上次的明暗与配色
      try {
        if (localStorage.getItem("wb-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
        var p = localStorage.getItem("wb-palette");
        if (p) document.documentElement.dataset.palette = p;
        // 字体：标题 / 正文分开存；旧版单选项做一次迁移
        var FM = { song: ["song", "hei"], hei: ["hei", "hei"], yuan: ["yuan", "yuan"], kai: ["kai", "hei"] };
        var ft = localStorage.getItem("wb-font-title");
        var fb = localStorage.getItem("wb-font-body");
        var fo = localStorage.getItem("wb-font");
        if (fo && FM[fo]) {
          if (!ft) ft = FM[fo][0];
          if (!fb) fb = FM[fo][1];
        }
        if (ft) document.documentElement.dataset.fontTitle = ft;
        if (fb) document.documentElement.dataset.fontBody = fb;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
